    <text x="98" y="168" fill="#cbd5e1" font-size="26">Desarrollador de software senior · Líder técnico</text>
    <text x="98" y="214" fill="#38bdf8" font-size="20" font-family="Consolas, 'Courier New', monospace">.NET / C#  ·  PHP / Laravel  ·  Vue  ·  Oracle  ·  SQL Server</text>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#94a3b8" text-anchor="end">
    <text x="1136" y="96">Medellín, Colombia</text>
    <text x="1136" y="122">+8 años en sistemas que no pueden parar</text>
  </g>
  <g transform="translate(980 170)" fill="none" stroke="url(#acento)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <path d="M40 10 L10 45 L40 80"/>
    <path d="M116 10 L146 45 L116 80"/>
    <path d="M90 4 L66 86"/>
